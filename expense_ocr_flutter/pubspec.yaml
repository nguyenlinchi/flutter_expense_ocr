
name: expense_ocr_flutter
description: Offline-first AI expense tracker with receipt OCR
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera và chọn ảnh
  camera: ^0.11.0
  image_picker: ^1.0.7
  image_cropper: ^8.0.2

  # OCR chạy trực tiếp trên thiết bị
  google_mlkit_text_recognition: ^0.11.0

  # SQLite và lưu ảnh trong bộ nhớ ứng dụng
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3

  # Quản lý trạng thái
  flutter_riverpod: ^2.5.1

  # Điều hướng màn hình
  go_router: ^13.2.0

  # Định dạng ngày và tiền VND
  intl: ^0.19.0

  # Gọi Gemini API qua HTTPS
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
